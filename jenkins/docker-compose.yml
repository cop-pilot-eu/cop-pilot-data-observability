# Deployment stack used by jenkins/Jenkinsfile.
#
# Always invoke through jenkins/scripts/compose.sh, which pins the project name
# and the env file. Running plain `docker compose` from another directory would
# create a *different* project.
#
# DATA SAFETY
#   * The database volume is declared `external: true`. Compose never creates
#     or deletes external volumes, so even `docker compose down -v` cannot
#     remove it. Only an explicit `docker volume rm <name>` can.
#   * DB_MOUNT_TARGET / DB_PGDATA are computed by scripts/db-preflight.sh from
#     the volume's actual on-disk layout. Don't hard-code them here.
#   * No host ports are published in this file. Ports live in
#     docker-compose.ports.yml, used only for the real deployment, so the CI
#     test stack can run next to production without port clashes.

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be set}

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    # Must be >= the TimescaleDB version that last opened the data (prod: 2.31.0).
    # Never downgrade: the extension refuses to load an older version.
    image: ${DB_IMAGE:-timescale/timescaledb:2.31.0-pg18}
    command: ["postgres", "-c", "log_statement=none"]
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      PGDATA: ${DB_PGDATA:-/var/lib/postgresql/18/docker}
    volumes:
      - type: volume
        source: db_data
        target: ${DB_MOUNT_TARGET:-/var/lib/postgresql}
    # Give Postgres time to checkpoint and shut down cleanly on stop.
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  data-analytics:
    <<: *restart
    build:
      context: ../data-analytics
    image: ${IMAGE_PREFIX}cop-pilot-data-observability-analytics:${DOCKER_TAG:?DOCKER_TAG must be set}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/openapi.json"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    <<: *restart
    build:
      context: ../backend
    image: ${IMAGE_PREFIX}cop-pilot-data-observability-be:${DOCKER_TAG}
    environment:
      APP_NAME: cop-pilot-data-observability-be
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      DATA_ANALYTICS_URL: http://data-analytics:8000
      NOTIFY_BASE_URL: ${NOTIFY_BASE_URL:?NOTIFY_BASE_URL must be set}
      BROKER_SYNC_ENABLED: ${BROKER_SYNC_ENABLED:-false}
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      data-analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/clusters').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  frontend:
    <<: *restart
    build:
      context: ../frontend
    image: ${IMAGE_PREFIX}cop-pilot-data-observability-fe:${DOCKER_TAG}
    environment:
      NUXT_BACKEND_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  db_data:
    name: ${DB_VOLUME:?DB_VOLUME must be set}
    external: true
